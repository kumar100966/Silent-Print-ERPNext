[project]
name = "silent_print"
authors = [
    { name = "Roque Vera", email = "roquegv@gmail.com" }
]
description = "Silent print using https://github.com/imTigger/webapp-hardware-bridge"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe" # Installed and managed by bench. Listing it here makes uv resolve
    # frappe from PyPI, which fails: frappe's own metadata pins pypika to a git URL
    # and uv rejects URL dependencies in transitive position.
    "PyMuPDF>=1.23.0",
]
license = { text = "MIT" }

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "silent_print"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
